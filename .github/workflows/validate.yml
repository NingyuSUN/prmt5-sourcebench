name: Validate benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/baseline.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements/baseline.txt
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test source, model and evaluation contracts
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reproduce frozen metrics and bootstrap draws
        run: python scripts/reproduce_metrics.py --root . --output-dir outputs/ci-replay
